version: '3.8'

services:
  # 1. Serviço do Banco de Dados PostgreSQL
  db_prosaude:
    image: postgres:15-alpine
    container_name: db_prosaude
    environment:
      POSTGRES_DB: prosaude_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - prosaude-network
    restart: always

  # 2. Serviço da API Spring Boot
  api_prosaude:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api_prosaude
    ports:
      - "8081:8081"
    environment:
      # Injeta os dados do banco usando o nome do serviço "db_prosaude" como host
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db_prosaude:5432/prosaude_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=1234
      # Mantém o Hibernate atualizando as tabelas automaticamente
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - db_prosaude
    networks:
      - prosaude-network
    restart: always

volumes:
  postgres_data:

networks:
  prosaude-network:
    driver: bridge